<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View PDF Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        /* Make sure the viewer container handles sizing nicely */
        .pdf-container {
            position: relative;
            width: 100%;
            height: 80vh; /* Takes up 80% of the viewport height */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Project Documentation</h2>
        <p>Please review the document below directly in your browser.</p>
        
        <div class="pdf-container">
            <!-- #toolbar=0 disables the top toolbar (including download/print) in many browsers -->
            <iframe src="your-document.pdf#toolbar=0&navpanes=0">
                <p>This browser does not support inline PDFs. Please use a modern desktop browser to view it.</p>
             iframe>
        </div>
    </div>

</body>
</html>
